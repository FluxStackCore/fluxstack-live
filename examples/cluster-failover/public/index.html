<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cluster Failover Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; font-size: 0.9rem; }

    .panel { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .panel h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Connection */
    .server-btns { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
    .server-btn { padding: 0.75rem 1.5rem; border: 2px solid #334155; border-radius: 8px; background: transparent; color: #e2e8f0; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
    .server-btn:hover { border-color: #60a5fa; }
    .server-btn.active { border-color: #3b82f6; background: #1d4ed8; color: white; }
    .status-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .dot.connected { background: #22c55e; }

    /* Counter */
    .count-display { text-align: center; padding: 2rem 0; }
    .count-value { font-size: 4rem; font-weight: 700; color: #f8fafc; }
    .count-server { font-size: 0.9rem; color: #60a5fa; margin-top: 0.5rem; }
    .action-btns { display: flex; gap: 0.75rem; justify-content: center; }
    .action-btn { padding: 0.6rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: all 0.15s; }
    .action-btn:active { transform: scale(0.95); }
    .btn-dec { background: #dc2626; color: white; }
    .btn-inc { background: #16a34a; color: white; }
    .btn-reset { background: #334155; color: #e2e8f0; }

    /* History */
    .history { max-height: 200px; overflow-y: auto; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; }
    .history-entry { padding: 0.25rem 0; color: #94a3b8; border-bottom: 1px solid #1e293b; }
    .history-empty { color: #475569; font-style: italic; }

    /* Log */
    #log { max-height: 150px; overflow-y: auto; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; }
    .log-entry { padding: 0.15rem 0; color: #64748b; }
    .log-entry.error { color: #f87171; }
    .log-entry.success { color: #4ade80; }
  </style>
</head>
<body>
  <h1>Cluster Failover Demo</h1>
  <p class="subtitle">Two servers, one singleton component. Switch servers to test state persistence via Redis.</p>

  <!-- Server Switch -->
  <div class="panel">
    <h2>Connection</h2>
    <div class="server-btns">
      <button class="server-btn active" id="btnA" onclick="connectTo(3001)">Server A (:3001)</button>
      <button class="server-btn" id="btnB" onclick="connectTo(3002)">Server B (:3002)</button>
    </div>
    <div class="status-row">
      <div class="dot" id="dot"></div>
      <span id="status">Connecting...</span>
    </div>
  </div>

  <!-- Counter -->
  <div class="panel">
    <h2>SharedCounter (singleton)</h2>
    <div class="count-display">
      <div class="count-value" id="count">0</div>
      <div class="count-server" id="lastServer">-</div>
    </div>
    <div class="action-btns">
      <button class="action-btn btn-dec" onclick="doAction('decrement')">- 1</button>
      <button class="action-btn btn-reset" onclick="doAction('reset')">Reset</button>
      <button class="action-btn btn-inc" onclick="doAction('increment')">+ 1</button>
    </div>
  </div>

  <!-- History -->
  <div class="panel">
    <h2>Action History</h2>
    <div class="history" id="history">
      <div class="history-empty">No actions yet</div>
    </div>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>Event Log</h2>
    <div id="log"></div>
  </div>

  <script src="/live-client.js"></script>
  <script src="/app.js"></script>
</body>
</html>
